[project]
name = "python-ucap"
version = "0.7.2"
description = "A non-invasive DAP-based tool for MCU data acquisition, monitoring, and visualization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "matplotlib>=3.10.3",
    "numpy>=2.3.0",
    "pydantic>=2.11.5",
    "pyocd>=0.40.0",
    "pyswd",
    "pyqtgraph>=0.13",
    "PyQt6>6.8",
    "QtAwesome>=1.3.1",
    "pyelfwrapper>=0.0.6",
    "tomlkit>=0.15.0",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.uv.sources]
pyswd = { git = "https://github.com/cortexm/pyswd" }

[tool.uv]
package = true

[tool.setuptools]
packages = ['ucap', 'ucap.assets', 'ucap.monitor', 'ucap.probe']
include-package-data = true

[tool.setuptools.package-data]
"ucap.assets" = ["*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
ucap = 'ucap.cli:cli'
