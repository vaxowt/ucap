# =============================================================================
# pyocd.toml — pyOCD 后端示例，连接具体目标芯片
# 用法:
#   ucap rw  -c examples/pyocd.toml        # 单次读写
#   ucap mon -c examples/pyocd.toml        # 实时监测
#
# 先确认目标芯片可用:
#   pyocd list --targets
# =============================================================================

# 读写频率 (Hz)
# rw_freq = 500

[backend]
name = 'pyocd'

[backend.pyocd]
# 指定目标芯片型号（使用 `pyocd list --targets` 查看支持列表）
target = 'stm32f407vg'

# 调试器频率 (Hz)。0 最高速度（默认），正值指定频率，负值使用后端默认值。此处不设置，使用最高速度
# freq = 0
# 调试器序列号，若仅连接一个设备可留空
# serial_no = ''

[save]
enable = true
dir = 'data/pyocd_session'
auto_name = true
save_figure = true
save_config = true

[plot]
show = true

[[plot.figures]]
name = 'ADC & Timers'
axes = [['ax_adc'], ['ax_timer']]
sharex = 'col'

[[plot.figures]]
name = 'GPIO & Status'
axes = [['ax_gpio']]

[plot.axes.ax_adc.kwargs]
ylabel = 'ADC Value (counts)'

[plot.axes.ax_timer.kwargs]
ylabel = 'Timer (us)'
xlabel = 'Time (s)'

[plot.axes.ax_gpio.kwargs]
ylabel = 'GPIO State'

[mon]
view_window = 5.0
refresh_interval = 50
theme = 'dark'

# =============================================================================
# pre_vars: 采集前初始化/校验
# =============================================================================

[[pre_vars]]
name = 'device_id'
address = 0xE0042000
format = '<I'

[[pre_vars]]
name = 'flash_size'
address = 0x1FFF7A22
format = '<H'

# =============================================================================
# vars: 持续读写的寄存器
# =============================================================================

# --- STM32F407 ADC1 数据寄存器 ---
[[vars]]
name = 'adc1_data'
address = 0x4001204C
format = '<H'
plot = { axis = 'ax_adc' }
expr = 'x * 3.3 / 4096'

# --- STM32F407 TIM2 计数器 ---
[[vars]]
name = 'timer2_cnt'
address = 0x40000024
format = '<I'
plot = { axis = 'ax_timer' }

# --- STM32F407 GPIOA ODR (输出数据寄存器) ---
[[vars]]
name = 'gpioa_odr'
address = 0x40020014
format = '<I'
plot = { axis = 'ax_gpio' }

# =============================================================================
# post_vars: 采集后读取状态
# =============================================================================

[[post_vars]]
name = 'systick_val'
address = 0xE000E018
format = '<I'

[[post_vars]]
name = 'irq_pending'
address = 0xE000E208
format = '<I'

[extra]
metadata = { description = 'pyOCD demo with STM32F407VG', target = 'stm32f407vg' }
