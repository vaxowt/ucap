# =============================================================================
# pyswd.toml — pySWD backend example (ST-Link only)
# pySWD is faster and lighter than pyOCD, but only supports ST-Link debuggers.
# Usage:
#   ucap rw  -c examples/pyswd.toml        # Continuous read/write (Ctrl+C to stop)
#   ucap mon -c examples/pyswd.toml        # Real-time monitor with GUI
# =============================================================================

# Read/Write frequency (Hz)
rw_freq = 1000
# Actual read/write frequency deviation threshold (%), warns/errors below this
rw_freq_warning_tolerance = 0.001
rw_freq_error_tolerance = 0.01

[backend]
name = 'pyswd'
# Debugger frequency (Hz). 0 = max speed (default), positive = specific freq, negative = backend default. Explicitly set to 4 MHz here
freq = 4000000
# Debugger serial number. Required when multiple devices are connected; leave empty for single device
# serial_no = ''

[save]
enable = true
dir = 'data/pyswd_session'
auto_name = true
save_figure = true

[plot]
show = true

[[plot.figures]]
name = 'Sensor & Control'
axes = [['ax_sensor'], ['ax_control']]
sharex = 'col'

[plot.axes.ax_sensor.kwargs]
ylabel = 'Value'
xlabel = 'Time (s)'

[plot.axes.ax_control.kwargs]
ylabel = 'Control Output'

# =============================================================================
# pre_vars: Read chip info and initialize before acquisition
# =============================================================================

[[pre_vars]]
name = 'device_id'
address = 0xE0042000
format = '<I'

[[pre_vars]]
name = 'uid'
address = 0x1FFF7A10
format = '<III'
struct = ['uid0', 'uid1', 'uid2']

# =============================================================================
# vars: Variables to read/write continuously
# =============================================================================

# --- Internal temperature sensor (STM32 ADC channel) ---
[[vars]]
name = 'temperature'
address = 0x4001204C
format = '<H'
expr = '(x * 3.3 / 4096 - 0.76) / 0.0025 + 25'
plot = { axis = 'ax_sensor' }

# --- Supply voltage detection ---
[[vars]]
name = 'vrefint'
address = 0x40012050
format = '<H'
expr = '3.3 * 4096 / x'
plot = { axis = 'ax_sensor' }

# --- PWM duty cycle ---
[[vars]]
name = 'pwm_duty'
address = 0x40000434
format = '<I'
plot = { axis = 'ax_control' }

# =============================================================================
# post_vars: Read runtime status after acquisition
# =============================================================================

[[post_vars]]
name = 'systick_val'
address = 0xE000E018
format = '<I'

[[post_vars]]
name = 'fault_status'
address = 0x40000444
format = '<I'

[extra]
metadata = { description = 'pySWD demo — ST-Link only, tested on STM32F4', backend = 'pyswd' }
