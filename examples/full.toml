# =============================================================================
# Mock 后端示例 — 无需硬件即可测试 ucap 全部功能
# 用法: ucap rw -c examples/full.toml        # 单次读写
#       ucap mon -c examples/full.toml       # 实时监测
# =============================================================================

# 读写频率 (Hz)
rw_freq = 500

[backend]
name = 'mock'

[backend.mock]
# 读回值叠加的高斯噪声标准差（写入值作为均值）。设 0 则精确返回写入值
sigma = 3.0

[save]
enable = true
dir = 'data'
auto_name = true
save_figure = true
save_config = true

# =============================================================================
# 绘图配置：两个 figure，4 个 axis
# =============================================================================
[plot]
show = true

[[plot.figures]]
name = 'Scalar & Array Variables'
axes = [['ax_scalar'], ['ax_array']]
sharex = 'col'

[[plot.figures]]
name = 'Struct & Computed Variables'
axes = [['ax_struct'], ['ax_computed']]
sharex = 'col'

[plot.axes.ax_scalar.kwargs]
ylabel = 'Value'

[plot.axes.ax_array.kwargs]
ylabel = 'Array Values'

[plot.axes.ax_struct.kwargs]
ylabel = 'Struct Members'

[plot.axes.ax_computed.kwargs]
ylabel = 'Computed'
xlabel = 'Time (s)'

# =============================================================================
# pre_vars: 采集前读写一次，存入 metadata['pre_data']
# 前两个演示独立读写；后五个为 vars 写入初始值，使 monitor 显示有意义的数据
# =============================================================================

[[pre_vars]]
name = 'device_id'
address = 0x20000000
format = '<I'
value = 0x1234ABCD

[[pre_vars]]
name = 'firmware_version'
address = 0x20000004
format = '<BB'
struct = ['major', 'minor']
value = [1, 3]

# --- 以下为 vars 寄存器播种初始值 ---
[[pre_vars]]
name = 'raw_adc'
address = 0x20000010
format = '<i'
value = 2048

[[pre_vars]]
name = 'temperature'
address = 0x20000014
format = '<f'
value = 25.0

[[pre_vars]]
name = 'accel'
address = 0x20000020
format = '<hhh'
value = [0, 0, 1000]

[[pre_vars]]
name = 'gyro'
address = 0x20000030
format = '<hhh'
value = [100, -50, 200]

[[pre_vars]]
name = 'status'
address = 0x20000040
format = '<BBH'
struct = ['flags', '_pad0', 'counter']
value = [3, 0, 0]

# =============================================================================
# vars: 持续读写的寄存器
# =============================================================================

# --- 标量：有符号 32 位整数，带 expr 变换 ---
[[vars]]
name = 'raw_adc'
address = 0x20000010
format = '<i'
plot = { axis = 'ax_scalar' }
expr = 'x * 3.3 / 4096'

# --- 标量：32 位浮点数，无 expr ---
[[vars]]
name = 'temperature'
address = 0x20000014
format = '<f'
plot = { axis = 'ax_scalar' }

# --- 多值（无 struct）：3 个 int16，统一 expr 缩放 ---
[[vars]]
name = 'accel'
address = 0x20000020
format = '<hhh'
plot = { axis = 'ax_array' }
expr = 'x * 0.001'

# --- 多值（无 struct）+ dict expr：按索引分别变换 ---
[[vars]]
name = 'gyro'
address = 0x20000030
format = '<hhh'
plot = { axis = 'ax_array' }
expr = { 0 = 'x * 0.01', 1 = 'x * 0.01' }
# 索引 2 保持原值（未在 expr 中指定）

# --- 结构体：含 pad 字段，分成员 plot ---
[[vars]]
name = 'status'
address = 0x20000040
format = '<BBH'
struct = ['flags', '_pad0', 'counter']
plot = { flags = { axis = 'ax_struct' }, counter = { axis = 'ax_struct' } }

# --- 纯计算寄存器：引用标量 ---
[[vars]]
name = 'power'
expr = 'raw_adc * temperature'

# --- 纯计算寄存器：引用多值成员（无 struct 用下标，如 accel[0]）---
[[vars]]
name = 'accel_magnitude'
expr = 'sqrt(accel[0] ** 2 + accel[1] ** 2 + accel[2] ** 2)'
plot = { axis = 'ax_computed' }

# --- 写入寄存器：每次循环写入固定值 ---
[[vars]]
name = 'cmd_enable'
address = 0x20000050
format = '<B'
value = 1

# =============================================================================
# post_vars: 采集后读写一次，存入 metadata['post_data']
# =============================================================================

[[post_vars]]
name = 'cycle_count'
address = 0x20000008
format = '<I'

[extra]
metadata = { description = 'Mock demo — no real hardware needed' }
data = { note = 'All variable data are simulated with Gaussian noise' }
