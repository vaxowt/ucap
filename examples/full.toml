# =============================================================================
# Mock backend demo — test all ucap features without hardware
# Usage: ucap rw -c examples/full.toml        # Continuous read/write (Ctrl+C to stop)
#        ucap mon -c examples/full.toml       # Real-time monitor with GUI
# =============================================================================

# Read/Write frequency (Hz)
rw_freq = 500

[backend]
name = 'mock'

[backend.mock]
# Stddev of Gaussian noise added to readback (write value is mean). Set 0 to return exact written value
sigma = 3.0

[save]
enable = true
dir = 'data'
auto_name = true
save_figure = true
save_config = true

# =============================================================================
# Plot config: 2 figures, 4 axes
# =============================================================================
[plot]
show = true

[[plot.figures]]
name = 'Scalar & Array Variables'
axes = [['ax_scalar'], ['ax_array']]
sharex = 'col'

[[plot.figures]]
name = 'Struct & Computed Variables'
axes = [['ax_struct'], ['ax_computed']]
sharex = 'col'

[plot.axes.ax_scalar.kwargs]
ylabel = 'Value'

[plot.axes.ax_array.kwargs]
ylabel = 'Array Values'

[plot.axes.ax_struct.kwargs]
ylabel = 'Struct Members'

[plot.axes.ax_computed.kwargs]
ylabel = 'Computed'
xlabel = 'Time (s)'

# =============================================================================
# pre_vars: Read/write once before acquisition, stored in metadata['pre_data']
# First two demonstrate independent read/write; latter five seed vars with initial values so monitor shows meaningful data
# =============================================================================

[[pre_vars]]
name = 'device_id'
address = 0x20000000
format = '<I'
value = 0x1234ABCD

[[pre_vars]]
name = 'firmware_version'
address = 0x20000004
format = '<BB'
struct = ['major', 'minor']
value = [1, 3]

# --- Seed initial values for vars ---
[[pre_vars]]
name = 'raw_adc'
address = 0x20000010
format = '<i'
value = 2048

[[pre_vars]]
name = 'temperature'
address = 0x20000014
format = '<f'
value = 25.0

[[pre_vars]]
name = 'accel'
address = 0x20000020
format = '<hhh'
value = [0, 0, 1000]

[[pre_vars]]
name = 'gyro'
address = 0x20000030
format = '<hhh'
value = [100, -50, 200]

[[pre_vars]]
name = 'status'
address = 0x20000040
format = '<BBH'
struct = ['flags', '_pad0', 'counter']
value = [3, 0, 0]

# =============================================================================
# vars: Variables to read/write continuously
# =============================================================================

# --- Scalar: signed 32-bit integer with expr transformation ---
[[vars]]
name = 'raw_adc'
address = 0x20000010
format = '<i'
plot = { axis = 'ax_scalar' }
expr = 'x * 3.3 / 4096'

# --- Scalar: 32-bit float, no expr ---
[[vars]]
name = 'temperature'
address = 0x20000014
format = '<f'
plot = { axis = 'ax_scalar' }

# --- Multi-value (no struct): 3 int16s with uniform expr scaling ---
[[vars]]
name = 'accel'
address = 0x20000020
format = '<hhh'
plot = { axis = 'ax_array' }
expr = 'x * 0.001'

# --- Multi-value (no struct) + dict expr: per-index transformations ---
[[vars]]
name = 'gyro'
address = 0x20000030
format = '<hhh'
plot = { axis = 'ax_array' }
expr = { 0 = 'x * 0.01', 1 = 'x * 0.01' }
# Index 2 is kept as-is (not specified in expr)

# --- Struct: with padding field, per-member plotting ---
[[vars]]
name = 'status'
address = 0x20000040
format = '<BBH'
struct = ['flags', '_pad0', 'counter']
plot = { flags = { axis = 'ax_struct' }, counter = { axis = 'ax_struct' } }

# --- Computed-only var: referencing a scalar ---
[[vars]]
name = 'power'
expr = 'raw_adc * temperature'

# --- Computed-only var: referencing multi-value member (no struct, use index like accel[0]) ---
[[vars]]
name = 'accel_magnitude'
expr = 'sqrt(accel[0] ** 2 + accel[1] ** 2 + accel[2] ** 2)'
plot = { axis = 'ax_computed' }

# --- Write variable: write fixed value each cycle ---
[[vars]]
name = 'cmd_enable'
address = 0x20000050
format = '<B'
value = 1

# =============================================================================
# post_vars: Read/write once after acquisition, stored in metadata['post_data']
# =============================================================================

[[post_vars]]
name = 'cycle_count'
address = 0x20000008
format = '<I'

[extra]
metadata = { description = 'Mock demo — no real hardware needed' }
data = { note = 'All variable data are simulated with Gaussian noise' }
