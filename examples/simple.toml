# =============================================================================
# simple.toml — Minimal config example
# Usage: ucap rw -c examples/simple.toml      # Continuous read/write (Ctrl+C to stop)
# =============================================================================

# Read/Write frequency (Hz). If unset, uses maximum frequency
rw_freq = 100

[backend]
name = 'mock'

[save]
enable = true
dir = 'data'
auto_name = true

# =============================================================================
# vars: Variables to read/write continuously
# =============================================================================

[[vars]]
name = 'sensor_value'
address = 0x20000000
format = '<f'

[[vars]]
name = 'status'
address = 0x20000004
format = '<II'
struct = ['flag1', 'flag2']

[extra]
metadata = { description = 'Simple demo configuration' }
