# Log level: debug, info, warning, error
log_level = 'info'
# Read/Write frequency (Hz). If unset, uses maximum frequency
# rw_freq =
# Read/Write duration (seconds). 0 = unlimited
# rw_duration = 0
# Actual read/write frequency deviation threshold (%), warns when below this
rw_freq_warning_tolerance = 0.001
# Actual read/write frequency deviation threshold (%), errors out when below this
rw_freq_error_tolerance = 0.01
# ELF file path. Required if var address is a variable name
# elf_file =
# Delay between pre_vars and vars read/write, in seconds
pre_delay = 0.0
# Delay between vars and post_vars read/write, in seconds. Not effective in mon mode
post_delay = 0.0

[backend]
# Backend name: pyswd, pyocd, openocd, mock. If empty, defaults to pyocd
# pyswd is faster but only supports ST-Link
# openocd requires starting the OpenOCD daemon first (default: localhost:4444)
# mock is a simulated backend for testing without hardware
# name =
# Debugger serial number. Leave empty if only one device is connected. Required when multiple devices are connected
serial_no = ''
# Debugger frequency (Hz). 0 = max speed (default), positive = specific freq, negative = backend default
# freq = 0

# pyOCD configuration, target chip. If empty, defaults to cortex_m
# Use `pyocd list --targets` to find supported targets
[backend.pyocd]
# target =

# OpenOCD configuration
[backend.openocd]
host = 'localhost'
port = 4444

# Mock backend configuration: stddev of Gaussian noise added to readback (write value is mean). Set 0 for exact written value
[backend.mock]
sigma = 5.0

[save]
# Enable saving
enable = true
# Data parent directory
dir = 'data'
# Data subdirectory name
# name =
# Auto-name subdirectory
auto_name = true
# Override if subdirectory is not empty
override = false
# Data file name
data_filename = 'data'
# Metadata file name
metadata_filename = 'metadata'
# Config file name
config_filename = 'config'
# Save plot images
save_figure = false
# Save configuration
save_config = true
# Metadata JSON indent
metadata_indent = 2

# Target variables to read/write continuously, saved as data['data']
[[vars]]
# Name, str, required
name =
# Variable address, int (address) or str (variable name). Not needed for pure expr; required otherwise
# address =
# Variable format, str. Not needed for pure expr; required otherwise
# Reference: https://docs.python.org/3/library/struct.html#format-strings
# format =
# Set value. If given, the variable is in write mode; leave empty for read mode
# value =
# Data structure, list. If given, read data is automatically unpacked into a dict
# Entries starting with "_" are discarded
# struct =
# Example: read 2 values of the same type. Output format:
#       data['data'][var_name] = {'name1': [short, short, ...], 'name2': [short, short, ...]}
# format = '<hh'
# struct = ['name1', 'name2']
# Example: read 2 values of different types and discard padding. Output format:
#       data['data'][var_name] = {'name1': [short, short, ...], 'name2': [int, int, ...]}
# format = '<hhI'
# struct = ['name1', '_pad1', 'name2']
# Plot settings
# For multi-value or struct vars, multiple lines are plotted according to plot config, labeled as "var_name.field_name"
# Multi-value without struct: field_name is the index string ('0', '1', ...)
# With struct: field_name is the struct member name
plot = {axis = 'default', type = 'plot', kwargs = {}}
# Example 1: define plot settings per struct member; undefined members are not plotted
# struct = ['name1', 'name2', 'name3']
# plot = {name1 = {axis='ax1'}, name2 = {axis='default'}}
# Expression for transforming read values or defining computed-only variables
# Format: string (uniform transform) or dict (per-member transform)
# In expressions, x represents the raw variable value; you can reference other variable names
# Supports numpy functions (sqrt, sin, etc.)
# expr =
# Example 1: scale factor
# expr = 'x * 3.3 / 4096'
# Example 2: reference another variable
# expr = 'x * voltage'        # voltage must be defined before this var
# Example 3: computed-only variable (no address/format needed, expr must be string)
# name = 'power'
# expr = 'voltage * current'
# Example 4: struct/unified expr, apply same transformation to each member
# struct = ['ax', 'ay', 'az']
# expr = 'x * 0.001'
# Example 5: struct/dict expr, apply different transformations per member; unspecified members keep original value
# struct = ['ax', 'ay', 'az']
# expr = {ax = 'x * 9.81', ay = 'x * 9.81', az = 'x * 9.81 + 1'}
# expr = {ax = 'x * 9.81'}   # ay, az keep original value
# Example 6: array (multi-value without struct)/unified expr, apply same transformation to each element
# format = '<hh'
# expr = 'x * 0.001'
# Example 7: array/dict expr, apply different transformations to specific elements; keys are element indices (0-based)
# format = '<hh'
# expr = {0 = 'x * 2', 1 = 'x * 3'}
# expr = {0 = 'x * 2'}        # index 1 keeps original value

# Variables read/written once before vars read/write, saved in metadata['pre_data']
# [[pre_vars]]
# Same settings as vars

# Variables read/written once after vars read/write, saved in metadata['post_data']. Not effective in mon mode
# [[post_vars]]
# Same settings as vars

[plot]
# Show plot window
show = true

[[plot.figures]]
# Figure name, required
# name =
# Axes layout, required
# Example: single axis
# axes = 'ax1'
# Example: 3x1 layout
# axes = ['ax1', 'ax2', 'ax3']
# Example: 1x3 layout
# axes = [['ax1'], ['ax2'], ['ax3']]
# Example: 2x2 layout with one empty slot
# axes = [['ax1', 'ax2'], [false, 'ax3']]
# Reference: https://matplotlib.org/stable/api/_as_gen/matplotlib.pyplot.subplots.html
# figsize =
# Options: none, all, row, col, true/false
sharex = false
# Options: none, all, row, col, true/false
sharey = false
# Options: constrained, compressed, tight, none, empty
layout = 'tight'

[plot.axes.<axis_name>]
# Reference: https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.html#matplotlib.axes.Axes
kwargs = {}

[mon]
# Real-time monitor view window duration (seconds)
view_window = 10.0
# Refresh interval (milliseconds)
refresh_interval = 10
# Status bar update interval (milliseconds)
status_interval = 1000
# Queue size, 0 means unlimited
queue_size = 0
# Plot line width
linewidth = 2
# Theme: light or dark
theme = 'light'
# Downsample display data
downsampling = true
# Enable anti-aliasing. May cause lag at high acquisition rates
antialias = false
# Enable OpenGL
use_opengl = false
# Probe mode interpolation. When false, vline snaps to nearest data point
probe_interpolation = false

[extra]
# Custom metadata, merged with captured metadata as metadata['extra']
metadata = {}
# Custom data, merged with captured data as data['extra']
data = {}
